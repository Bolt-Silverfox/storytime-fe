# Tags a release when a PR merges into main, mirroring the flow already used by
# storytime_be and storytime-mobile so every deployable repo is tagged the same
# way. Unlike those two there is no app.json here, so package.json is the single
# source of truth for the version.
name: Release Tag

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version // empty' package.json)
          if [ -z "$VERSION" ]; then
            echo "::error file=package.json::package.json has no \"version\" field."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          REMOTE=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" "refs/tags/${TAG}" | head -n1 | cut -f1)
          if [ -z "$REMOTE" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No ${TAG} yet — will tag ${GITHUB_SHA}."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          if [ "$REMOTE" = "$GITHUB_SHA" ]; then
            echo "${TAG} already points at ${GITHUB_SHA} — nothing to do."
            exit 0
          fi
          echo "::warning::${TAG} already exists at ${REMOTE:0:8}, but this merge is ${GITHUB_SHA:0:8}. This commit is being released UNTAGGED. Bump the version and merge again if this is a real release."
          {
            echo "### :warning: Release is untagged"
            echo ""
            echo "\`${TAG}\` already points at \`${REMOTE:0:8}\`, but this merge is \`${GITHUB_SHA:0:8}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
