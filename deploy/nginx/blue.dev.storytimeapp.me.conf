# Blue frontend — blue.dev.storytimeapp.me -> storytime-fe-blue (127.0.0.1:3010)
# Runs ALONGSIDE green (dev.storytimeapp.me -> :3000) on the same host.
#
# Install:
#   sudo cp deploy/nginx/blue.dev.storytimeapp.me.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/blue.dev.storytimeapp.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS:
#   sudo certbot --nginx -d blue.dev.storytimeapp.me

server {
    listen 80;
    listen [::]:80;
    server_name blue.dev.storytimeapp.me;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
