# dev.web.storytimeapp.me -> storytime-fe-dev (PM2) on 127.0.0.1:3674
# Shared dev/staging server. After copying this to
# /etc/nginx/sites-available/ and symlinking into sites-enabled/, run:
#   sudo certbot --nginx -d dev.web.storytimeapp.me
# to obtain a TLS cert and have certbot rewrite this block for HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name dev.web.storytimeapp.me;

    location / {
        proxy_pass http://127.0.0.1:3674;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
