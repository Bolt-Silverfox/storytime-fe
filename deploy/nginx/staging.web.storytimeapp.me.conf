# staging.web.storytimeapp.me -> storytime-fe-staging (PM2) on 127.0.0.1:3675
# Shared dev/staging server. After enabling, run:
#   sudo certbot --nginx -d staging.web.storytimeapp.me

server {
    listen 80;
    listen [::]:80;
    server_name staging.web.storytimeapp.me;

    location / {
        proxy_pass http://127.0.0.1:3675;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
